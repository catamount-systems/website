<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catamount Systems</title>
  <meta name="description" content="Catamount Systems">
  <style>
    :root { --bg:#f7f7f5; --fg:#1b1d1f; --muted:#5f6368; --accent:#b4561e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141517; --fg:#ececea; --muted:#9aa0a6; --accent:#e08a4f; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    main { max-width: 640px; }
    .mark { width: 40px; height: 4px; background: var(--accent); margin-bottom: 24px; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -0.02em; margin: 0 0 12px; }
    p { color: var(--muted); font-size: 1.125rem; line-height: 1.6; margin: 0; }
    footer { margin-top: 48px; font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>Catamount Systems</h1>
    <p>Our new site is on its way.</p>
    <footer>&copy; <span id="y">2026</span> Catamount Systems</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
